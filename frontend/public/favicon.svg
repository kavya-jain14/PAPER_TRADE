<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Dark background tile -->
  <rect width="100" height="100" rx="22" fill="#0e0e0e"/>

  <!-- Subtle inner glow border -->
  <rect x="2" y="2" width="96" height="96" rx="20" fill="none" stroke="#3de530" stroke-width="2" stroke-opacity="0.3"/>

  <!-- PT lettermark — same paths as PTLogo component -->
  <!-- Outer box (PT container) -->
  <rect x="15" y="15" width="70" height="70" rx="14" fill="none" stroke="#3de530" stroke-width="6"/>

  <!-- Top horizontal bar of T -->
  <path d="M 30 35 L 70 35" stroke="#3de530" stroke-width="6" stroke-linecap="round"/>

  <!-- Shared vertical stem for P and T -->
  <path d="M 42 35 L 42 68" stroke="#3de530" stroke-width="6" stroke-linecap="round"/>

  <!-- Bowl of P -->
  <path d="M 42 35 L 56 35 A 11 11 0 0 1 56 57 L 42 57" stroke="#3de530" stroke-width="6" stroke-linecap="round" fill="none"/>

  <!-- Subtle green glow dot in bottom right -->
  <circle cx="72" cy="72" r="4" fill="#3de530" opacity="0.7"/>
</svg>